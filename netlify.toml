# The site and /api/* run on Netlify.
# Orders live in Supabase (run supabase/store.sql).
# Secrets stay in the Netlify UI, not in this file:
#   ADMIN_EMAIL, ADMIN_PASSWORD, JWT_SECRET,
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
#   RESEND_API_KEY, EMAIL_FROM, SUPPORT_EMAIL
# Leave TEST_PAYMENTS unset.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_VERSION = "v1"
  # These are store settings, not secrets. Their values are also in this file and the site.
  SECRETS_SCAN_OMIT_KEYS = "SHIPPING_PAISE,SITE_VERSION,PUBLIC_URL,SUPPORT_EMAIL,EMAIL_FROM,ADMIN_EMAIL,ADMIN_NOTIFY_EMAIL"

[context.production.environment]
  SITE_VERSION = "v1"
  PUBLIC_URL = "https://bittertruthcoffee.in"
  SHIPPING_PAISE = "9000"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Sitemap and robots are real files. These rules sit ahead of the SPA rewrite.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/order/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/account"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/track-order"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
